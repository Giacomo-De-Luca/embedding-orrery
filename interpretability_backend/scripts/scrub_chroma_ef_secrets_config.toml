# Remove secrets (an HF token) from the embedding-function configs ChromaDB
# persisted for existing collections (see backend/utils/chroma_config_scrubber.py).
#
# Run from the repository root with the backend STOPPED:
#   uv run python -m interpretability_backend.scripts.scrub_chroma_ef_secrets
# Point at another config with ORRERY_SCRUB_EF_SECRETS_CONFIG=/path/to/config.toml

# true = only report what would be removed; false = remove it.
dry_run = true

# Copy chroma.sqlite3 to chroma.sqlite3.<timestamp>.bak before writing.
backup = true

# ChromaDB store to clean (absolute, or relative to the directory you run from).
# Empty = the live store, interpretability_backend/resources/vector_db.
chroma_path = ""

# Keys removed from inside embedding-function configs (case-insensitive).
secret_keys = ["token", "use_auth_token", "hf_token", "api_key"]
