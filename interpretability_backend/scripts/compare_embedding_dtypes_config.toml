# Compare a model's float32 and bfloat16 embeddings on this machine (the check
# behind keeping bf16 checkpoints in bf16 on Apple GPUs).
#
# Loads the model twice, one dtype at a time; run it while the backend is idle:
#   uv run python -m interpretability_backend.scripts.compare_embedding_dtypes
# Point at another config with ORRERY_DTYPE_COMPARISON_CONFIG=/path/to/config.toml

model = "google/embeddinggemma-2"
device = "mps"          # "mps", "cuda" or "cpu"
batch_size = 16
neighbours = 10         # top-k neighbours compared per text
# prompt = "Retrieval-document"   # optional prompt name of the model
# max_length = 2048               # optional input-length cap in tokens

